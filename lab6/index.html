<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evidența elevilor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Evidența elevilor</h1>


    <section class="card form-card mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3" id="form-title">Adaugă un elev</h2>

        <div id="mesaj-eroare" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-elev" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nume" class="form-label">Nume și prenume</label>
              <input type="text" id="nume" class="form-control" placeholder="Ex: Ion Popescu">
            </div>
            <div class="col-md-2 col-6">
              <label for="varsta" class="form-label">Vârstă</label>
              <input type="number" id="varsta" class="form-control" min="1" placeholder="16">
            </div>
            <div class="col-md-4 col-6">
              <label for="grupa" class="form-label">Grupă / clasă</label>
              <input type="text" id="grupa" class="form-control" placeholder="Ex: 11B">
            </div>
            <div class="col-12">
              <label for="email" class="form-label">E-mail</label>
              <input type="email" id="email" class="form-control" placeholder="ion.popescu@exemplu.md">
            </div>
          </div>

          <div class="mt-3 d-flex gap-2">
            <button type="submit" id="btn-submit" class="btn btn-primary">Adaugă elev</button>
            <button type="button" id="btn-anuleaza" class="btn btn-outline-secondary d-none">Anulează editarea</button>
          </div>
        </form>
      </div>
    </section>

    <section class="row g-2 align-items-center mb-3">
      <div class="col-md-6">
        <input type="search" id="cautare" class="form-control" placeholder="Caută după nume și prenume">
      </div>
      <div class="col-6 col-md-3">
        <span class="text-muted">Total elevi: <strong id="total">0</strong></span>
      </div>
      <div class="col-6 col-md-3 text-end">
        <button type="button" id="btn-sterge-toti" class="btn btn-outline-danger btn-sm">Șterge toți elevii</button>
      </div>
    </section>

    <!-- Carduri -->
    <section id="lista-elevi" class="row g-3"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
